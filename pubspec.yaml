name: tide_slide
description: A slide-to-confirm control for Flutter in two styles, a rising tide or a zipper that seals shut. LTR, RTL, keyboard and screen reader ready.
version: 1.1.3
repository: https://github.com/YagnikBarasiya23/tide_slide
issue_tracker: https://github.com/YagnikBarasiya23/tide_slide/issues
topics:
  - slider
  - button
  - widget
  - animation
  - confirmation
screenshots:
  - description: Tide rising behind the thumb while dragging.
    path: doc/screenshot.png
  - description: Zipper style, teeth meshing shut behind the thumb.
    path: doc/zipper.png

environment:
  sdk: ^3.13.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
